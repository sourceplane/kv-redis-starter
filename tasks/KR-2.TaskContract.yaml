apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The upstream Redis starter runs on Cloudflare Workers with its counter in Workers KV, a per-environment rendered wrangler config and green checks
  affects:
    - apps/web
    - tests/web
    - pnpm-lock.yaml
    - package.json
    - turbo.json
  doneWhen:
    - pnpm wire:fixture, typecheck, lint, test and build are green in Checks
    - wrangler dev serves the page and the count grows per request
  gates:
    - checks
