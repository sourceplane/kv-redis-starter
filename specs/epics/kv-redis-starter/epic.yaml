# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (KR → KR-1, KR-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: kv-redis-starter
  key: KR
spec:
  title: "Vercel's Redis Next.js Starter on Cloudflare Workers with Workers KV"
  summary: "The Vercel Redis (formerly Vercel KV) Next.js Starter — one page whose view counter increments a Redis key on every request — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare with the counter in a Workers KV namespace provisioned by Terraform through Orun, inside the Cirrus baseline's repository conventions. It is the smallest template that needs a binding, and it establishes the shape for every port that does: a wrangler template with wiring tokens, an offline fixture for the verify lane, and a live render from the infrastructure's wiring document on deploy."
  state: completed
  milestones:
    - name: "KR0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [KR-1]
    - name: "KR1 — the counter on Workers KV"
      exitCriteria:
        - "apps/web is the upstream template with the counter reading and writing the VIEWS KV binding"
        - "the wrangler config renders per environment from the cloudflare-kv root's wiring document (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves the page and the count grows by one per request"
      tasks: [KR-2]
    - name: "KR2 — the KV namespace from Terraform"
      exitCriteria:
        - "infra/terraform/cloudflare-kv provisions the stage and prod namespaces and publishes the wiring document the app renders from"
      tasks: [KR-3]
    - name: "KR3 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it, and what KV's consistency means for the counter"
        - "the as-built status records every departure from the upstream template"
      tasks: [KR-4]
    - name: "KR4 — a baseline, in one landing"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in ONE landing (01-product) and a hook-only record (02-docs)"
        - "the product's own push-to-main plan applies cloudflare-kv before it deploys web, and the landing's await finds WIRING_CLOUDFLARE_KV on stage and prod"
        - "a product built from it carries the product only, renamed throughout to its own name, repository, Worker and namespace titles"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [KR-5]
    - name: "KR5 — the cirrus standard"
      exitCriteria:
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a product"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [KR-6, KR-7]
    - name: "KR6 — the domain is set later"
      exitCriteria:
        - "the console card asks for no domain: a site goes live on workers.dev, and productdomain is an optional build input that defaults to empty"
        - "a site built without a domain is branded with the reserved placeholder <reponame>.example.com wherever the domain goes (BASE_DOMAIN), and its README says how an owner sets the real one"
        - "Baseline CI places, leak-checks and plans a site built with no domain"
      tasks: [KR-8]
    - name: "KR7 — the build reads true"
      exitCriteria:
        - "every line the console's build panel prints for a build of this baseline is true of what happened and short: each hook's line comes from its own outputs, a waiting phase says what it waits on in the engine's words, every start line is one clause (orun-cloud saas-build-panel BV4)"
        - "each landing is labelled and the docs phase's re-probe files no second set of addresses, through hook keys an older orun ignores"
        - "a product ships an AGENTS.md that tells an agent what to read first, how a change lands and what not to touch"
      tasks: [KR-9]
